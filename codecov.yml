coverage:
  status:
    project:
      default:
        target: 75%
        threshold: 2%
    patch:
      default:
        target: 70%
        threshold: 5%
  ignore:
    - "tests/*"
    - "benchmarks/*"
    - "examples/*"
  fixes:
    - "src/::src/"
    - "include/::include/"

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
