name: UndefinedBehaviorSanitizer

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  ubsan:
    name: UBSan (gcc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install System Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake ninja-build

      - name: Configure CMake Build with UBSan
        run: |
          cmake -B build_ubsan -G Ninja \
            -DCMAKE_BUILD_TYPE=UBSan \
            -DCMAKE_C_CLANG_TIDY=""

      - name: Build with UBSan
        run: |
          cmake --build build_ubsan

      - name: Run Tests under UBSan
        run: |
          timeout 60 ctest --test-dir build_ubsan --output-on-failure || true