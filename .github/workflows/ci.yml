name: cmem Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.compiler.cc }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: "gcc", cxx: "g++" }
          - { cc: "clang", cxx: "clang++" }
        build_type: [ "Debug", "Release", "ASan", "TSan", "UBSan" ]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install System Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build valgrind gcc g++ clang

      - name: Run Makefile Build & Sanitizer Unit Tests
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          CONFIG=$(echo "${{ matrix.build_type }}" | tr '[:upper:]' '[:lower:]')
          make clean
          make CONFIG=$CONFIG all
          make CONFIG=$CONFIG test
          make CONFIG=$CONFIG test_cpp
          make CONFIG=$CONFIG bench
          make CONFIG=$CONFIG examples
          timeout 120 make CONFIG=debug stress_test

      - name: Configure CMake Build
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          cmake -B build_cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build CMake Targets
        run: |
          cmake --build build_cmake

      - name: Execute CTest Test Suite
        run: |
          ctest --test-dir build_cmake --output-on-failure

      - name: Valgrind Memory Safety & Leak Check Audit
        if: matrix.build_type == 'Debug' && matrix.compiler.cc == 'gcc'
        run: |
          valgrind --leak-check=full --errors-for-leak-kinds=definite,possible --error-exitcode=1 ./build_cmake/unit_tests
          valgrind --leak-check=full --errors-for-leak-kinds=definite,possible --error-exitcode=1 ./build_cmake/cpp_tests

      - name: ASan Leak Detection Check
        if: matrix.build_type == 'ASan' && matrix.compiler.cc == 'gcc'
        env:
          LSAN_OPTIONS: detect_leaks=0
        run: |
          echo 'ASan build: memory error detection enabled, leak detection disabled (cmem has own leak tracker)'
          timeout 60 ctest --test-dir build_cmake --output-on-failure

  clang-tidy:
    name: Clang-Tidy Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install System Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-tidy

      - name: Configure CMake Build with Clang-Tidy
        run: |
          cmake -B build_cmake -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_CLANG_TIDY="clang-tidy"

      - name: Build with Clang-Tidy
        run: |
          cmake --build build_cmake

  fuzzing:
    name: Fuzzing (libFuzzer)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build Fuzzer
        run: make fuzz-build

      - name: Run Fuzzing (10 minutes)
        run: |
          mkdir -p fuzz_corpus
          echo "AABBCCDD" > fuzz_corpus/seed1
          echo "0123456789" > fuzz_corpus/seed2
          echo "FFFFFFFFFFFFFFFF" > fuzz_corpus/seed3
          echo "0000000000000000" > fuzz_corpus/seed4
          ./fuzz_alloc -max_total_time=600 -rss_limit_mb=1024 fuzz_corpus fuzz_artifacts || true

      - name: Upload Fuzzing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz_artifacts/
          retention-days: 14

  # Windows MSVC build disabled due to missing pthread.h and C11 atomic support on MSVC
  # windows-build:
  #   name: Windows Build (MSVC)
  #   runs-on: windows-2022
  #
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - name: Configure CMake
  #       run: cmake -B build -G "Visual Studio 17 2022" -A x64
  #
  #     - name: Build
  #       run: cmake --build build --config Release
  #
  #     - name: Test
  #       run: ctest --test-dir build --config Release --output-on-failure

  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install System Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format

      - name: Check Code Formatting
        run: |
          make format-check

      - name: Validate Mermaid Diagrams
        run: |
          make check-mermaid
