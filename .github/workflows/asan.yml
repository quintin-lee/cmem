name: AddressSanitizer

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  asan:
    name: AddressSanitizer (gcc)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install System Dependencies & Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake ninja-build

      - name: Configure CMake Build with AddressSanitizer
        run: |
          cmake -B build_asan -G Ninja \
            -DCMAKE_BUILD_TYPE=ASan \
            -DCMAKE_C_CLANG_TIDY=""

      - name: Build with AddressSanitizer
        run: |
          cmake --build build_asan

      - name: Run Tests under AddressSanitizer
        run: |
          timeout 60 ctest --test-dir build_asan --output-on-failure